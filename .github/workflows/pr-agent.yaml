name: Cursor Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH    
      - name: Perform Cursor code review (separate comments + request changes)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODEL: gpt-5
        run: |
          set -euo pipefail

          cursor-agent --force --model "$MODEL" --output-format=text --print "$(cat <<'PROMPT'
          You are operating in a GitHub Actions runner to review a PR.
          Use gh CLI (authenticated via GH_TOKEN). You can post multiple separate comments and request changes.

          CONTEXT:
          - Repo: ${{ github.repository }}
          - PR: #${{ github.event.pull_request.number }}
          - Head: ${{ github.event.pull_request.head.sha }}
          - Base: ${{ github.event.pull_request.base.sha }}

          REPOSITORY RULES (ENFORCE):
          1) Scope of PR
            - One PR must change code only in ONE service/directory.
            - If >1 service → ask to split PR.
            - If >2 services → explicitly recommend separate PRs.
            Services are top-level folders: service_1/, service_2/, service_3/, service_4/, service_5/.
            Ignore infra at root: .github/**, .cursor/**, *.md, lock-files.

          2) Vue store anti-pattern
            - No `watch()` inside store; move side-effects/watchers to components or composables.

          3) Props with 4+ fields → named type + defineProps<Props>()

          4) No inline object types in Ref / ref()

          5) Magic numbers/strings → named const (or consts.ts)

          6) Complex :class object (>1 key AND any conditional) → computed

          7) Priority: 🔒 security, ⚡ performance, proper error handling around external calls and edge cases.

          WHAT TO DO:
          - Build a list of issues from the PR diff (focus on clear, high-severity rule violations).
          - For EACH issue, post ONE separate PR comment:
              gh pr comment ${{ github.event.pull_request.number }} --body "<short 1-2 sentence actionable comment with an emoji: 🚨/🔒/⚡/⚠️/✨>"
            Keep comments concise, non-duplicated, and point to the exact file/line context in text.
          - After posting all comments:
            - If you posted >=1 issue comment OR found violation of the scope-of-PR rule → run:
                gh pr review ${{ github.event.pull_request.number }} --request-changes -b "Automated review found issues. See individual comments."
              And then PRINT EXACTLY on the LAST LINE:
                RESULT:REQUEST_CHANGES
            - Otherwise:
                gh pr review ${{ github.event.pull_request.number }} --comment -b "Automated review: no high-severity issues found."
                And then PRINT EXACTLY on the LAST LINE:
                RESULT:OK

          INFO YOU CAN USE:
          - Full diff:      gh pr diff ${{ github.event.pull_request.number }}
          - Changed files:  gh pr diff ${{ github.event.pull_request.number }} --name-only
          - Existing notes: gh pr view ${{ github.event.pull_request.number }} --json comments

          COMMENT STYLE:
          - 1 issue → 1 comment (separate), keep it short and specific, include a concrete fix hint.
          - Use emojis: 🚨 Critical 🔒 Security ⚡ Performance ⚠️ Logic ✅ Resolved ✨ Improvement

          PROMPT
          )" | tee /tmp/cursor.out

              # Если агент напечатал финальный маркер REQUEST_CHANGES — падаем шагом (блокируем merge)
              if tail -n1 /tmp/cursor.out | grep -q 'RESULT:REQUEST_CHANGES'; then
                echo "Detected issues → failing the job to block merge."
                exit 1
              fi